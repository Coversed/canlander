<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Dice Cup Canlander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#6b7a89;--line:#d9e0e7;--count:#0f766e;--drop:#c3ccd5;--gold:#c8962b;--hi:#e3f1ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f161d;--panel:#18222c;--ink:#e8eef3;--mute:#8d9cab;--line:#2a3743;--count:#3cc4b5;--drop:#3a4856;--gold:#e0b04a;--hi:#1d3335}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.banner{background:var(--hi);border:1px solid var(--count);border-radius:8px;padding:8px 12px;margin-bottom:18px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 10px}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;max-width:280px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--hi)}
.name{font-weight:600}
.badge{color:var(--gold);font-weight:800}
.strip{display:inline-flex;align-items:flex-end;gap:1px;height:20px;vertical-align:middle}
.strip i,.bars i{display:block;background:var(--count);border-radius:1px}
.strip i{width:3px}
.strip i.d,.bars i.d{background:var(--drop)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line)}
.bars>div,.bars>a{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
.bars i{width:100%}
.dates{display:flex;gap:3px;font-size:9px;color:var(--mute)}
.dates span{flex:1;text-align:center;overflow:hidden}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}
.stats b{display:block;font-size:24px;font-weight:800}
.stats span{color:var(--mute);font-size:13px}
.key{font-size:12px;color:var(--mute);margin-top:8px}
.key u{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--count);text-decoration:none;vertical-align:-1px}
.key u.d{background:var(--drop)}
.bars a{text-decoration:none}
.bars a:hover i{opacity:.7}
.chip{display:inline-flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:0 6px 6px 0;color:var(--ink);text-decoration:none}
a.chip:hover{background:var(--hi);border-color:var(--count)}
.chip small{color:var(--mute);font-size:11px}
.foot{color:var(--mute);font-size:12px}
:focus-visible{outline:2px solid var(--count);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>2026 Dice Cup Canlander</h1>
<p class="sub" id="sub"></p>
<div class="banner" id="banner" hidden></div>

<section class="panel">
  <h2>Leaderboard</h2>
  <input id="q" type="search" placeholder="Search players" aria-label="Search players">
  <div class="scroll"><table>
    <thead><tr>
      <th data-k="rank">#</th><th data-k="name">Player</th><th data-k="score">Score</th>
      <th data-k="played">Played</th><th data-k="mw">MW%</th><th data-k="wins">4-0s</th><th>Season</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="key"><u></u> counts towards best 20 &nbsp; <u class="d"></u> dropped &nbsp; Click a player for their season.</p>
</section>

<section class="panel" id="detail" hidden></section>

<section class="panel">
  <h2>Attendance by week</h2>
  <div class="bars" id="att"></div>
  <div class="dates" id="attd"></div>
</section>

<section class="panel" id="wk" hidden>
  <h2>Results by week</h2>
  <div id="weeks"></div>
  <p class="key">Each date opens that night's results post.</p>
</section>

<p class="foot" id="foot"></p>
</main>

<script>
/* ============ SETUP ============
   1. In Google Sheets: File > Share > Publish to web > pick your results tab, choose "Comma-separated values (.csv)", Publish.
   2. Paste the link between the quotes below. Leave it empty to see the built-in demo snapshot. */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSK2YOnU1Rt3uZpEOI-sPSQGnpnNf_nnLA_9Tn8N-ou1zYYmbPxkBGH8Q8hpoRIzFXZ4yllj31ZbRlN/pub?gid=1095806745&single=true&output=csv";

/* Optional: paste your Apps Script web app link here to read the hyperlinks behind the "Link" cells. */
const LINKS_API_URL = "https://script.google.com/macros/s/AKfycby79gR3VoCG60BFNiC3AbM0f0awxvbaGCkx6HQ818ifHHzOCZiFiV1FtMHvB_3c_QVo/exec";

/* ---------- Demo snapshot (used only when SHEET_CSV_URL is empty) ---------- */
const W = s => s.split(",").map(v => v.trim() === "" ? null : +v);
const DEMO_DATES = "04-Jan,11-Jan,25-Jan,01-Feb,08-Feb,15-Feb,22-Feb,01-Mar,08-Mar,15-Mar,22-Mar,29-Mar,05-Apr,12-Apr,26-Apr,03-May,10-May,17-May,24-May,31-May,07-Jun,14-Jun,21-Jun,28-Jun,05-Jul,12-Jul,19-Jul,26-Jul,02-Aug,16-Aug,23-Aug,30-Aug,06-Sep,13-Sep,20-Sep,03-Oct,10-Oct".split(",");
const DEMO_COUNTS = [15,13,16,14,15,12,15,10,12,10,8,14,9,12,13,13,10,12,13,16,18,11,9,17,10,11,12,13,12,14,12,13,10,13,12,10,18];
const DEMO_WEEKLY = {
 "Ember Smithers":"6,6,4,12,9,,12,9,6,12,3,6,,12,,,,,9,,9,,12,9,,,3,12,6,,6,,0,6,6,9,9",
 "Helena Jackson":"3,9,9,6,12,3,10,,,3,,6,6,9,9,6,,,9,6,6,12,7,9,3,12,9,7,,8,9,9,3,9,,,6",
 "Jethro Sutherland":"4,6,4,7,7,6,,9,7,,6,4,,9,6,7,7,8,9,9,6,,6,9,9,9,7,6,9,10,,9,12,12",
 "James Ding":"6,12,6,9,3,6,9,9,6,6,9,3,12,3,12,9,9,12,,6,6,0,,1,6,3,0,3,6,9,3,6,6,6,9,6,0",
 "George Hunt":",9,9,3,4,10,6,4,9,6,3,9,,,6,6,12,6,10,12,9,3,,,6,6,6,6",
 "Jae Austin-Loczy":"9,6,4,4,6,9,4,9,,7,,6,3,6,6,,3,6,3,9,4,3,,12,9,6,,9,3,6,6,6,,9,3,4,9",
 "Alex Hazard":"6,3,6,,,,9,,,,6,3,,6,9,9,,3,7,,3,6,3,9,6,9,6,9,6,6,9,9,0,,,,6",
 "Edward Sanderson":"6,3,,6,,0,,,,,,,9,6,3,6,6,3,6,,0,,9,6,3,9,6,3,,,3,12,12,,12,12,3"
};
// name|score|played|mw%|4-0s|lowest
const DEMO_ROWS = `Ember Smithers|177|25|64|6|6
Helena Jackson|176|29|62|3|6
Jethro Sutherland|171|29|63|2|6
James Ding|168|35|52|4|6
George Hunt|151|23|58|2|4
Jae Austin-Loczy|151|31|51|1|6
Alex Hazard|142|25|51|0|3
Edward Sanderson|138|24|50|4|3
Henry Clayton|134|24|50|1|3
Gregory Painter|123|30|43|0|3
Mark Punter|117|20|49|2|0
Hazel Shilling|106|17|52|0|1
Hal Hewlett|99|14|59|0|3
Sammi Austin-Loczy|84|30|25|0|3
Dunc Sabin|82|18|38|0|0
Niall Maxwell-Thompson|72|10|60|2|0
Kieran Drinkwater|60|9|56|1|3
Owen Davis|51|7|61|0|3
Matt Clay|46|6|64|0|3
Francesco Vitiello|40|5|67|1|4
Matt Errock|36|6|50|0|3
Ben Epstein|31|7|37|0|3
Fuzz|31|4|65|0|6
JJ|25|4|52|0|3
Arvid Briscoe|17|7|20|0|0
Toni|15|3|42|0|3
Daniel Hughes|15|3|42|0|3
Alys Lloyd|12|2|50|0|6
Tom Wilkinson|10|1|83|0|10
Ani|9|2|38|0|3
Zach Cox|9|2|38|0|3
Lucy Adams|7|1|58|0|7`;

function demoData(){
  const players = DEMO_ROWS.split("\n").map((l,i)=>{
    const [name,score,played,mw,wins,low]=l.split("|");
    return {rank:i+1,name,score:+score,played:+played,mw:+mw,wins:+wins,low:+low,
            weeks: DEMO_WEEKLY[name] ? W(DEMO_WEEKLY[name]) : null};
  });
  return {title:"2026 Dice Cup Canlander", dates:DEMO_DATES, counts:DEMO_COUNTS, links:[], players, demo:true};
}

/* ---------- Live data: read the published CSV ---------- */
function parseCSV(t){
  const rows=[]; let r=[], c="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ r.push(c); c=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; r.push(c); rows.push(r); r=[]; c=""; }
    else c+=ch;
  }
  if(c!==""||r.length){ r.push(c); rows.push(r); }
  return rows;
}
function liveData(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>(r[0]||"").trim()==="Rank");
  if(hi<0) throw new Error("Couldn't find the 'Rank' header row. Is this the right tab?");
  const ws=rows[hi].findIndex((c,i)=>i>=7&&c.trim()==="1");
  const dateRow=rows.find(r=>r.some(c=>c.trim()==="Date:"))||[];
  const cntRow=rows.find(r=>r.some(c=>c.trim()==="No of Players:"))||[];
  let dates=dateRow.slice(ws).map(s=>s.trim());
  let n=dates.length; while(n>0&&!dates[n-1]) n--;
  dates=dates.slice(0,n);
  const counts=cntRow.slice(ws,ws+n).map(v=>+v||0);
  const linkRow=rows.find(r=>r.slice(ws,ws+n).some(c=>/^https?:\/\//i.test(c.trim())));
  const links=linkRow?linkRow.slice(ws,ws+n).map(c=>/^https?:\/\//i.test(c.trim())?c.trim():""):[];
  const players=[];
  for(const r of rows.slice(hi+1)){
    if(!/^\d+$/.test((r[0]||"").trim())||!(r[1]||"").trim()) continue;
    players.push({rank:+r[0],name:r[1].trim(),score:+r[2]||0,played:+r[3]||0,
      mw:parseFloat(r[4])||0,wins:+r[5]||0,low:+r[6]||0,
      weeks:r.slice(ws,ws+n).map(v=>v.trim()===""?null:+v)});
  }
  return {title:(rows[0][0]||"").trim()||"Canlander", dates, counts, links, players, demo:false};
}

/* ---------- Best-20 logic ---------- */
function counted(weeks){
  const idx=weeks.map((v,i)=>v===null?null:[v,i]).filter(Boolean).sort((a,b)=>b[0]-a[0]||b[1]-a[1]).slice(0,20);
  return new Set(idx.map(x=>x[1]));
}
function strip(p,max){
  if(!p.weeks) return "";
  const keep=counted(p.weeks);
  return '<span class="strip">'+p.weeks.map((v,i)=>v===null?'<i style="height:1px;opacity:.3" class="d"></i>'
    :`<i class="${keep.has(i)?"":"d"}" style="height:${Math.max(2,v/max*20)}px"></i>`).join("")+"</span>";
}

/* ---------- Render ---------- */
let D, sortK="rank", sortDir=1, sel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderRows(){
  const q=$("q").value.toLowerCase();
  const list=D.players.filter(p=>p.name.toLowerCase().includes(q))
    .sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==="string"?x.localeCompare(y):x-y)*sortDir;});
  $("rows").innerHTML=list.map(p=>`<tr data-n="${esc(p.name)}" class="${p.name===sel?"sel":""}" tabindex="0">
    <td>${p.rank}</td><td class="name">${esc(p.name)}</td><td>${p.score}</td><td>${p.played}</td>
    <td>${p.mw}%</td><td>${p.wins?'<span class="badge">'+p.wins+'</span>':'0'}</td><td>${strip(p,12)}</td></tr>`).join("");
}
function renderDetail(){
  const p=D.players.find(x=>x.name===sel), el=$("detail");
  if(!p){ el.hidden=true; return; }
  el.hidden=false;
  let body='<p class="foot">Weekly results aren\'t in the demo snapshot for this player. Connect your sheet to see them.</p>';
  if(p.weeks){
    const keep=counted(p.weeks), recent=p.weeks.filter(v=>v!==null).slice(-5);
    const form=recent.length?(recent.reduce((a,b)=>a+b,0)/recent.length).toFixed(1):"-";
    body=`<div class="stats"><div><b>${p.score}</b><span>Best 20 total</span></div>
      <div><b>${p.played}</b><span>Weeks played</span></div><div><b>${p.mw}%</b><span>Match win rate</span></div>
      <div><b>${p.wins}</b><span>4-0 nights</span></div><div><b>${form}</b><span>Average of last 5</span></div></div>
      <div class="bars">${p.weeks.map((v,i)=>`<div title="${fd(D.dates[i]||"")}: ${v===null?"did not play":v}">${v===null?"":`<i class="${keep.has(i)?"":"d"}" style="height:${v/12*100}%"></i>`}</div>`).join("")}</div>
      <div class="dates">${D.dates.map(d=>`<span>${d.slice(0,2)}</span>`).join("")}</div>
      <p class="key"><u></u> counts &nbsp; <u class="d"></u> dropped. Bar height is the week's score out of 12.</p>`;
  }
  el.innerHTML=`<h2>${esc(p.name)} <span class="foot">rank ${p.rank}</span></h2>`+body;
}
function renderAttendance(){
  const max=Math.max(...D.counts,1);
  $("att").innerHTML=D.counts.map((c,i)=>{
    if(!c) return '<div></div>';
    const t=`title="${fd(D.dates[i])}: ${c} players"`, bar=`<i style="height:${c/max*100}%"></i>`, l=(D.links||[])[i];
    return l?`<a ${t} href="${esc(l)}" target="_blank" rel="noopener">${bar}</a>`:`<div ${t}>${bar}</div>`;
  }).join("");
  $("attd").innerHTML=D.dates.map(d=>`<span>${d.slice(0,2)}</span>`).join("");
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fd(d){const m=/^(\d{1,2})\/(\d{1,2})/.exec(d);return m?(+m[1])+" "+MON[+m[2]-1]:d;}
function renderWeeks(){
  const L=D.links||[];
  $("wk").hidden=!L.some(Boolean);
  $("weeks").innerHTML=D.dates.map((d,i)=>{
    if(!(D.counts[i]>0)) return "";
    const inner=`${fd(d)}<small>${D.counts[i]} players</small>`;
    return L[i]?`<a class="chip" href="${esc(L[i])}" target="_blank" rel="noopener">${inner}</a>`:`<span class="chip">${inner}</span>`;
  }).join("");
}
function paint(d){
  D=d;
  document.title=D.title;
  const played=D.counts.filter(c=>c>0);
  $("sub").textContent=`${played.length} weeks played, ${D.players.length} players. Only each player's best 20 results count.`;
  if(D.demo){ $("banner").hidden=false;
    $("banner").textContent="Showing a demo snapshot with weekly detail for the top 8. Set SHEET_CSV_URL in this file to go live with every player."; }
  else $("banner").hidden=true;
  $("foot").textContent=D.demo?"Demo data":"Loaded from the published sheet at "+new Date().toLocaleTimeString();
  renderRows(); renderDetail(); renderAttendance(); renderWeeks();
}

$("q").addEventListener("input",renderRows);
document.querySelector("thead").addEventListener("click",e=>{
  const k=e.target.dataset.k; if(!k) return;
  sortDir=(sortK===k)?-sortDir:(k==="name"||k==="rank"?1:-1); sortK=k; renderRows();
});
function pick(e){ const tr=e.target.closest("tr"); if(!tr) return; sel=tr.dataset.n; renderRows(); renderDetail(); $("detail").scrollIntoView({behavior:"smooth",block:"nearest"}); }
$("rows").addEventListener("click",pick);
$("rows").addEventListener("keydown",e=>{ if(e.key==="Enter") pick(e); });

(async()=>{
  if(!SHEET_CSV_URL){ paint(demoData()); return; }
  try{
    const res=await fetch(SHEET_CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d=liveData(await res.text());
    if(LINKS_API_URL && !(d.links||[]).some(Boolean)){
      try{
        const j=await (await fetch(LINKS_API_URL)).json();
        d.links=(j.links||[]).slice(0,d.dates.length).map(u=>/^https?:\/\//i.test(u)?u:"");
      }catch(e){ console.warn("Couldn't load result links:",e); }
    }
    paint(d);
  }catch(err){
    paint(demoData());
    $("banner").hidden=false;
    $("banner").textContent="Couldn't load your sheet ("+err.message+"). Showing the demo snapshot. Check the published link and that you chose CSV.";
  }
})();
</script>
</body>
</html>
